name: Daily Scrape & DB Update

on:
  schedule:
    # 毎日 JST 07:00 (UTC 22:00) に実行
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'スクレイプ対象URL（省略時は変数のデフォルト値）'
        required: false
        type: string

jobs:
  scrape:
    name: Scrape & Translate
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      DB_PATH: ${{ github.workspace }}/events.db
      TARGET_URL: ${{ inputs.target_url || vars.TARGET_URL || 'https://www.kashiwa.u-tokyo.ac.jp/open_campus_2025/' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RENDER_ADMIN_URL: ${{ secrets.RENDER_ADMIN_URL }}
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scraper/requirements.txt'

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run scraper
        run: python scraper/scrape.py

      - name: Show scrape log
        run: |
          python3 << 'PYEOF'
          import sqlite3
          conn = sqlite3.connect('events.db')
          cols_info = conn.execute("PRAGMA table_info(scrape_log)").fetchall()
          cols = [c[1] for c in cols_info]
          logs = conn.execute("SELECT * FROM scrape_log ORDER BY id DESC LIMIT 5").fetchall()
          for log in logs:
              print(dict(zip(cols, log)))
          conn.close()
          PYEOF

      - name: Upload updated DB to backend
        if: env.RENDER_ADMIN_URL != ''
        run: |
          echo "Uploading DB to Render.com..."
          curl -X POST "${RENDER_ADMIN_URL}/api/admin/db-sync" \
            -H "X-API-Key: ${ADMIN_API_KEY}" \
            -F "db=@events.db" \
            --fail-with-body \
            && echo "DB sync successful" \
            || echo "DB sync failed (non-fatal)"

      # events.db を GitHub Release に保存（Render.com 再起動時の自動復元用）
      - name: Save DB to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-db --yes 2>/dev/null || true
          gh release create latest-db events.db \
            --title "Latest Events DB (auto-generated)" \
            --notes "スクレイパーが自動生成。Render.com 再起動時の DB 復元に使用。" \
            --target main \
            --latest 2>/dev/null || true
          echo "Release upload done"

      - name: Report summary
        if: always()
        run: |
          python3 << 'PYEOF' >> $GITHUB_STEP_SUMMARY
          import sqlite3
          try:
              conn = sqlite3.connect('events.db')
              total = conn.execute('SELECT COUNT(*) FROM events').fetchone()[0]
              last = conn.execute(
                  'SELECT run_at, new_count, updated_count, error_count FROM scrape_log ORDER BY id DESC LIMIT 1'
              ).fetchone()
              conn.close()
              print('## Scrape Summary')
              print(f'- Total events in DB: {total}')
              if last:
                  print(f'- Run at: {last[0]}')
                  print(f'- New: {last[1]}, Updated: {last[2]}, Errors: {last[3]}')
          except Exception as e:
              print(f'Could not read summary: {e}')
          PYEOF
